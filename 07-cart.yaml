- name: configuring cart server
  host: cart
  become: yes
  tasks:
  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y
  - name: install nodejs 20
    package:
      name: nodejs
      state: present
  - name: create system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system cart"
  - name: delete /app directory
    file:
      path: /app
      state: directory
  - name: delete cart.zip  in /tmp directory
    file:
      path: /tmp/cart.zip
      state: absent
  - name: create directory
    file:
      path: /app
      state: directory
  - name: download cart code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip
  - name: unzip cart code
    unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes
  - name: install depencies
    community.general.npm:
      path: /app
  - name: copy cart service
    template:
      src: cart-service.j2
      dest: /etc/systemd/system/cart.service
  - name: deamon reload
    systemd_service:
      name: cart
      daemon_reload: true
  - name: start and enable cart
    service:
      name: cart
      state: started
      enabled: yes