- name: congiguring mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongo repo
    copy: 
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: Install mongodb server
    package:
      name: mongodb-org
      state: present
  - name: allow remote connection(replace address from 127.0.0.1 to 0.0.0.0 in /etc/mongod.conf)
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1 '
      replace: '0.0.0.0'
  - name: start and enable  mongod service
    service:
      name: mongod
      state: started
      enable: yes
  
  
      