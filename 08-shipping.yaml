- name: configuring shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: install maven
    package: 
      name: maven
      state: present
  - name: create system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: delete /app directory
    file:
      path: /app
      state: directory
  - name: delete shipping.zip  in /tmp directory
    file:
      path: /tmp/shipping.zip
      state: absent
  - name: create directory
    file:
      path: /app
      state: directory
  - name: download shipping code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
  - name: unzip shipping code
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  - name: install depencies
    community.general.npm:
      path: /app
  - name: copy shipping service
    template:
      src: shipping-service.j2
      dest: vim /etc/systemd/system/shipping.service
  - name: deamon reload
    systemd_service:
      name: shipping
      daemon_reload: true
  - name: start and enable shipping
    service:
      name: shipping
      state: started
      enabled: yes