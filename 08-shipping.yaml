- name: configuring shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: install maven and mysql
    package: 
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql
  - name: create system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: delete /app directory
    file:
      path: /app
      state: directory
  - name: delete shipping.zip  in /tmp directory
    file:
      path: /tmp/shipping.zip
      state: absent
  - name: create directory
    file:
      path: /app
      state: directory
  - name: download shipping code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
  - name: unzip shipping code
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    command: mvn clean package
    args:
      chdir: /app
  - name: moving shipping jar
    command: mv target/shipping-1.0.jar shipping.jar 
    args:
      chdir: /app
  - name: copy shipping service
    tempalte:
      src: shipping-service.j2
      dest: /etc/systemd/system/shipping.service
  - name: load mysql data
    community.mysql.mysql_db:
      state: import
      name: all
      login_user: root
      login_password: RoboShop@1
      login_host: "{{ MYSQL_HOST }}"
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql




  - name: daemon-reload
    systemd_service:
      name: shipping
      daemon_reload: true
  - name: start and enable shipping
    service:
      name: shipping
      state: started
      enabled: yes
  - name: 
     