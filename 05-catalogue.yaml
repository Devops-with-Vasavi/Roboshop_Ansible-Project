- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y
  - name: install nodejs 20
    package:
      name: nodejs 
      state: present
  - name: create roboshop system User # applications should run as nonroot user.
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: delete /app directory
    file:
      path: /app
      state: absent
  - name: delete catalogue.zip in tmp directory
    file:
     path: /tmp/catalogue.zip
     state: absent
  - name: create /app directory
    file:
     path: /app
     state: directory
  - name: download catalogue code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
  - name: unzip catalogue code
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes