- name: configuring redis server
  hosts: redis
  become: true
  tasks:
  - name: enable redis 
    command: dnf module enable redis:7 -y
  - name: install redis
    package:
      name: redis
      state: present
  - name: allow remote connection
    replace:
      path: /etc/redis/redis.conf
      regexp: 127.0.0.1 
      replace: 0.0.0.0